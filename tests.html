<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тесты CSV</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-bar">
      <h1>Тесты CSV</h1>
      <button type="button" id="theme-toggle" class="theme-toggle">Светлая тема</button>
    </div>
    <p class="lede">Проверка файлов из папки <code>csv</code> тем же разбором, что и на дашборде. <a href="index.html">Вернуться к Web-Dashboard</a></p>
  </header>
  <main>
    <section aria-labelledby="tests-title">
      <div class="section-head">
        <h2 id="tests-title">Результат</h2>
        <p class="hint" id="summary">Запуск…</p>
      </div>
      <ul class="test-list" id="results"></ul>
    </section>
  </main>
  <script src="script.js"></script>
  <script src="tests.js"></script>
</body>
</html>
